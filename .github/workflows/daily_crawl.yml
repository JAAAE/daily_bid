name: Daily Procurement Crawler

on:
  schedule:
    # 每天台灣時間晚上 20:17 自動執行 (UTC 12:17，避開整點排程尖峰)
    - cron: '17 12 * * *'
  workflow_dispatch: # 允許手動點擊按鈕執行

permissions:
  contents: write

concurrency:
  group: daily-procurement-crawler
  cancel-in-progress: false

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests urllib3

      - name: Run Crawler
        env:
          PYTHONUNBUFFERED: '1'
        run: python crawler.py

      - name: Commit and Push Changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local core.quotepath false

          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping git commit."
          else
            CURRENT_DATE=$(TZ="Asia/Taipei" date +'%Y-%m-%d %H:%M:%S')
            git commit -m "Auto-updated Tender Excel: ${CURRENT_DATE}"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "$TARGET_BRANCH"
            echo "SUCCESS! Excel updated and pushed to GitHub (${TARGET_BRANCH})!"
          fi
